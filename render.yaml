services:
  - type: web
    name: propiedades-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: propiedades-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: propiedades-db
    databaseName: propiedades
    user: propiedades_user
